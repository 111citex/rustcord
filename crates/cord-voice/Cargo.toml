[package]
name = "cord-voice"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
aes-gcm = "0.10"
alhazen-core = { version = "0.7", default-features = false }
alhazen-encode = { path = "../../../../SideStuffFromMain/alhazen-rs/alhazen-encode" }
chacha20poly1305 = "0.10"
cpal = { version = "0.18", features = ["pulseaudio"] }
davey = "0.2"
deep-filter-rt = "0.1.1"
futures-util = "0.3"
ndarray = "0.17"
nnnoiseless = { version = "0.5", default-features = false }
opus = "0.4"
rtrb = "0.4"
serde_json = "1"
symphonia = { version = "0.5", default-features = false, features = ["mp3"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
tracing = "0.1"
